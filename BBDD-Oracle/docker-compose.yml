version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=1234
      - APP_USER=admin
      - APP_USER_PASSWORD=1234
    volumes:
      - ./oradata:/opt/oracle/oradata:Z
    restart: unless-stopped