services:
  postgres-dam:
    image: postgres:latest
    container_name: postgres-dam
    restart: always
    environment:
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dam:/var/lib/postgresql
      - ./Scripts:/docker-entrypoint-initdb.d # Ruta simplificada

  pgadmin-dam:
    image: dpage/pgadmin4
    container_name: pgadmin-dam
    user: root
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.es
      PGADMIN_DEFAULT_PASSWORD: 1234
    volumes:
      - ./Scripts:/var/lib/pgadmin/storage/caua.hino_gmail.com # Ruta simplificada
    depends_on:
      - postgres-dam

volumes:
  pgdata_dam: